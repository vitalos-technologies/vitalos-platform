name: Super Admin deploy
run-name: Super Admin deploy ${{ github.event.workflow_run.head_sha || github.sha }}
# Production deploy of superadmin/ to Google Cloud Run (project vitalos-workforce, europe-west2): service
# vitalos-superadmin and release job vitalos-superadmin-release. The image is built to ghcr.io and pulled through
# the Artifact Registry remote repository "ghcr"; free-tier PostgreSQL (Supabase by default, or Neon); the
# Cloudflare edge Worker carries admin.vitalos.co.uk and portal.vitalos.co.uk to the service. DNS and Cloudflare
# are never changed here.
# Two triggers. (1) Automatic: when the "Super Admin" CI workflow completes successfully for a push to
# main that changed superadmin/ (not its docs or markdown) or this file, the exact commit CI tested
# (workflow_run.head_sha, never the moving branch tip) is deployed. A failed, cancelled or skipped CI
# run never deploys; destructive migrations anywhere since the deployed commit stop the run (guard in "plan"); the database is dumped
# and encrypted before migrations run; the live /healthz/ and image are checked afterwards.
# (2) Manual: workflow_dispatch with confirm=DEPLOY, for redeploys, rollbacks and reviewed destructive
# migrations. Manual runs skip the changed-files and migration guards.
# Deploys queue (group superadmin-deploy, never cancelled mid-migration). The deploy job uses the
# "production" environment (it resolves to the Vercel-created "Production"; no required reviewer on
# this plan). Google Cloud access is Workload Identity Federation (OIDC, no stored keys): the pool trusts only
# this repository's "production" environment subject and impersonates superadmin-deployer (DEPLOY.md §2.1).
# The environment holds SUPERADMIN_DATABASE_URL (the Super Admin's own Supabase session pooler or Neon pooled
# string, never the website's), BOOTSTRAP_ADMIN_EMAIL and, optionally, SENTRY_DSN, plus the optional mail and enquiry
# secrets and variables listed in superadmin/docs/email-setup.md section 9. The pre-migration backup job
# dispatches backup.yml (the "backup" environment, encrypted dump) and waits for it to succeed; this
# workflow never creates or uploads a dump itself, because the repository is public.
# See superadmin/docs/DEPLOY.md.
on:
  workflow_run:
    workflows: ["Super Admin"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy the selected ref to https://admin.vitalos.co.uk
        required: true
      smoke_test:
        description: >-
          Run the live browser smoke test (first deploy only: it signs in as the bootstrap admin,
          creates and archives "Smoke test" records, and is skipped once a real authenticator exists)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Only runs that can deploy join the queue; an ignored workflow_run (failed CI, say) gets its own
  # group so it can never replace a queued real deploy.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    && 'superadmin-deploy' || format('superadmin-deploy-ignored-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  # Not secrets: the identity pool admits only this repository's "production" environment.
  GCP_PROJECT: vitalos-workforce
  GCP_REGION: europe-west2
  CLOUD_RUN_SERVICE: vitalos-superadmin
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/447460690610/locations/global/workloadIdentityPools/github/providers/vitalos-platform
  GCP_DEPLOY_SERVICE_ACCOUNT: superadmin-deployer@vitalos-workforce.iam.gserviceaccount.com

jobs:
  current:
    # Reads the commit running in production (the Cloud Run image tag is the commit SHA) so the plan job
    # can scan every change since then. Read-only: one `gcloud run services describe`. It uses the
    # production environment only because the workload identity binding is bound to it; it needs
    # id-token and nothing else, and it never checks out or runs repository code.
    name: Read the deployed commit
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://admin.vitalos.co.uk
    outputs:
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - if: github.event_name == 'workflow_run'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - id: read
        name: Deployed image tag
        if: github.event_name == 'workflow_run'
        run: |
          image="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)"
          tag="${image##*:}"
          if [[ "$tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Deployed commit: $tag"
            echo "sha=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not read a commit SHA from the running image tag; the plan job will stop the deploy."
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: Plan (guards, resources and expected cost)
    needs: current
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - id: decide
        name: Decide the commit to deploy
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOYED_SHA: ${{ needs.current.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual deploy of $DISPATCH_SHA: changed-files and migration guards skipped."
            { echo "deploy=true"; echo "sha=$DISPATCH_SHA"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected head_sha"; exit 1; }
          # A skipped or cancelled job inside a "successful" CI run must not deploy either.
          conclusions="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs" --paginate --jq '.jobs[].conclusion')"
          total="$(grep -c . <<< "$conclusions" || true)"
          not_green="$(grep -vc '^success$' <<< "$conclusions" || true)"
          if [ "$total" -eq 0 ] || [ "$not_green" -ne 0 ]; then
            echo "::notice::Super Admin CI run $CI_RUN_ID has $not_green of $total jobs not green; not deploying."
            { echo "deploy=false"; echo "sha=$CI_SHA"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Range = everything between the commit running in production and the commit CI tested, so
          # quick successive merges cannot hide a risky migration. Anything unclear fails closed.
          manual="deploy manually with confirm=DEPLOY after review"
          if ! [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not determine the commit running in production (image tag is not a SHA, or the Cloud Run service could not be read). Automatic deploy stopped: $manual."
            exit 1
          fi
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --no-tags origin main "$CI_SHA" ||
            { echo "::error::Could not fetch history. Automatic deploy stopped: $manual."; exit 1; }
          git fetch -q --no-tags origin "$DEPLOYED_SHA" ||
            { echo "::error::Deployed commit $DEPLOYED_SHA is not fetchable. Automatic deploy stopped: $manual."; exit 1; }
          if ! git merge-base --is-ancestor "$DEPLOYED_SHA" "$CI_SHA"; then
            echo "::error::Deployed commit $DEPLOYED_SHA is not an ancestor of $CI_SHA. Automatic deploy stopped: $manual."
            exit 1
          fi
          echo "Scanning changes from deployed $DEPLOYED_SHA to $CI_SHA"
          changed="$(git diff --name-only "$DEPLOYED_SHA" "$CI_SHA")"
          echo "Files changed in range:"; echo "$changed"
          # Same scope as the Super Admin CI paths filter (its docs and markdown start nothing).
          relevant="$(grep -E '^(superadmin/|\.github/workflows/superadmin-deploy\.yml$)' <<< "$changed" |
            grep -vE '^superadmin/docs/|\.md$' || true)"
          if [ -z "$relevant" ]; then
            echo "::notice::No Super Admin runtime files changed in $CI_SHA; not deploying."
            { echo "deploy=false"; echo "sha=$CI_SHA"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Destructive-migration guard: migrations added or modified anywhere in the range.
          added="$(git diff --name-only --diff-filter=AM "$DEPLOYED_SHA" "$CI_SHA" -- 'superadmin/apps/*/migrations/*.py' |
            grep -v '__init__\.py$' || true)"
          bad=0
          for f in $added; do
            if hits="$(git show "$CI_SHA:$f" | grep -nE '\b(RemoveField|DeleteModel|RenameField|RenameModel|AlterField|RunSQL)\b')"; then
              echo "::error file=$f::Destructive or risky migration operation (AlterField needs review): $(tr '\n' ' ' <<< "$hits")"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::Automatic deploy stopped: deploy manually with confirm=DEPLOY after review."
            exit 1
          fi
          { echo "deploy=true"; echo "sha=$CI_SHA"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.decide.outputs.deploy == 'true'
        with:
          ref: ${{ steps.decide.outputs.sha }}
      - name: Print the deployment plan
        if: steps.decide.outputs.deploy == 'true'
        run: |
          superadmin/deploy/gcp/deploy.sh --dry-run | tee plan.txt
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and push image to ghcr.io
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      mirror: ${{ steps.image.outputs.mirror }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - id: image
        name: Image name
        # Package "vitalos-platform/superadmin". Cloud Run pulls it through the Artifact Registry remote
        # repository "ghcr", which mirrors ghcr.io under the same path.
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          path="${GITHUB_REPOSITORY_OWNER,,}/vitalos-platform/superadmin:${SHA}"
          echo "image=ghcr.io/$path" >> "$GITHUB_OUTPUT"
          echo "mirror=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/ghcr/$path" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: superadmin
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # No attestation manifests: they add package versions that count against storage.
          provenance: false
      - name: Keep only the 3 newest image versions (GitHub Packages free storage)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        continue-on-error: true
        with:
          package-name: vitalos-platform/superadmin
          package-type: container
          min-versions-to-keep: 3

  backup:
    name: Pre-migration database backup
    needs: [plan, build]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Run the Super Admin backup workflow and wait for it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No dump is created or uploaded here: this repository is public, so personal data stays out
          # of this workflow's artifacts and logs. backup.yml (the 'backup' environment) owns the dump.
          set -euo pipefail
          start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run backup.yml --repo "$GITHUB_REPOSITORY" --ref main
          id=""
          for attempt in $(seq 1 30); do
            id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backup.yml --event workflow_dispatch \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$start\")] | sort_by(.createdAt) | last | .databaseId // empty")"
            [ -n "$id" ] && break
            sleep 5
          done
          [ -n "$id" ] || { echo "::error::backup run did not start; no deploy without a fresh backup"; exit 1; }
          echo "Backup run $id"
          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15 ||
            { echo "::error::backup run $id failed; deploy stopped before migrations"; exit 1; }

  deploy:
    name: Deploy to Cloud Run
    needs: [plan, build, backup]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://admin.vitalos.co.uk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - id: prev
        name: Record the revision serving now (for the rollback command)
        run: |
          revision="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Currently serving: ${revision:-none (first deploy)}"
      - name: Deploy (secrets generated here, written only to Secret Manager)
        id: deploy
        env:
          IMAGE: ${{ needs.build.outputs.mirror }}
          DATABASE_URL: ${{ secrets.SUPERADMIN_DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          # Mail and enquiries (superadmin/docs/email-setup.md). Each is passed through only when set;
          # an unset secret or variable arrives empty and is skipped, never written over a stored value.
          PRIMARY_OWNER_EMAIL: ${{ vars.PRIMARY_OWNER_EMAIL }}
          EMAIL_TRANSPORT: ${{ vars.EMAIL_TRANSPORT }}
          INBOUND_PROVIDER: ${{ vars.INBOUND_PROVIDER }}
          NOTIFY_OWNER_EMAIL: ${{ vars.NOTIFY_OWNER_EMAIL }}
          OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
          OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
          OBJECT_STORAGE_REGION: ${{ vars.OBJECT_STORAGE_REGION }}
          RETENTION_ENFORCE: ${{ vars.RETENTION_ENFORCE }}
          RELAY_API_BASE_URL: ${{ vars.RELAY_API_BASE_URL }}
          RELAY_REALTIME_ENABLED: ${{ vars.RELAY_REALTIME_ENABLED }}
          RELAY_EMAIL_FROM: ${{ vars.RELAY_EMAIL_FROM }}
          # Outreach mailbox (ADR-051; email-setup.md step 13): Microsoft 365 over Graph, or SMTP.
          OUTREACH_MAILBOX: ${{ vars.OUTREACH_MAILBOX }}
          OUTREACH_GRAPH_TENANT_ID: ${{ vars.OUTREACH_GRAPH_TENANT_ID }}
          OUTREACH_GRAPH_CLIENT_ID: ${{ vars.OUTREACH_GRAPH_CLIENT_ID }}
          OUTREACH_SMTP_HOST: ${{ vars.OUTREACH_SMTP_HOST }}
          OUTREACH_SMTP_PORT: ${{ vars.OUTREACH_SMTP_PORT }}
          OUTREACH_SMTP_USER: ${{ vars.OUTREACH_SMTP_USER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          INBOUND_WEBHOOK_SECRET: ${{ secrets.INBOUND_WEBHOOK_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID }}
          OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OUTREACH_GRAPH_CLIENT_SECRET: ${{ secrets.OUTREACH_GRAPH_CLIENT_SECRET }}
          OUTREACH_SMTP_PASSWORD: ${{ secrets.OUTREACH_SMTP_PASSWORD }}
          # Insights and Careers (ADR-039 to ADR-042; superadmin/docs/DEPLOY.md section 9). Same rule:
          # an unset value is skipped, never written over a stored one.
          CONTENT_WEB_TARGETS: ${{ vars.CONTENT_WEB_TARGETS }}
          CONTENT_MEDIA_BUCKET: ${{ vars.CONTENT_MEDIA_BUCKET }}
          CONTENT_MEDIA_PUBLIC_BASE_URL: ${{ vars.CONTENT_MEDIA_PUBLIC_BASE_URL }}
          CAREERS_CV_BUCKET: ${{ vars.CAREERS_CV_BUCKET }}
          CAREERS_CV_MAX_MB: ${{ vars.CAREERS_CV_MAX_MB }}
          CAREERS_EMAIL_FROM: ${{ vars.CAREERS_EMAIL_FROM }}
          CAREERS_CANDIDATE_EMAILS_ENABLED: ${{ vars.CAREERS_CANDIDATE_EMAILS_ENABLED }}
          CONTENT_RELAY_SYNC_ENABLED: ${{ vars.CONTENT_RELAY_SYNC_ENABLED }}
          CONTENT_READ_RATE_LIMIT: ${{ vars.CONTENT_READ_RATE_LIMIT }}
          CONTENT_OPPORTUNISTIC_TICK: ${{ vars.CONTENT_OPPORTUNISTIC_TICK }}
          CONTENT_READ_CLIENT_KEYS: ${{ secrets.CONTENT_READ_CLIENT_KEYS }}
          CAREERS_SUBMIT_CLIENT_KEYS: ${{ secrets.CAREERS_SUBMIT_CLIENT_KEYS }}
          CONTENT_REVALIDATE_SECRET: ${{ secrets.CONTENT_REVALIDATE_SECRET }}
          CONTENT_RENDER_SECRET: ${{ secrets.CONTENT_RENDER_SECRET }}
          CONTENT_PREVIEW_SECRET: ${{ secrets.CONTENT_PREVIEW_SECRET }}
          CONTENT_IP_SALT: ${{ secrets.CONTENT_IP_SALT }}
          RELAY_ADMIN_API_SECRET: ${{ secrets.RELAY_ADMIN_API_SECRET }}
          RELAY_WEBHOOK_SECRET: ${{ secrets.RELAY_WEBHOOK_SECRET }}
          # Vitalos AI & Data model path (ADR-052, AID-017). Key: AI & Data's own secret when set, else the
          # organisation's ANTHROPIC_API_KEY. The in-app "model path" switch still starts off.
          AI_DATA_LLM_PROVIDER: ${{ vars.AI_DATA_LLM_PROVIDER }}
          AI_DATA_LLM_BASE_URL: ${{ vars.AI_DATA_LLM_BASE_URL }}
          AI_DATA_LLM_MODEL: ${{ vars.AI_DATA_LLM_MODEL }}
          AI_DATA_LLM_EFFORT: ${{ vars.AI_DATA_LLM_EFFORT }}
          AI_DATA_DISABLED: ${{ vars.AI_DATA_DISABLED }}
          AI_DATA_LLM_API_KEY: ${{ secrets.AI_DATA_LLM_API_KEY || secrets.ANTHROPIC_API_KEY }}
          # Billing (superadmin/apps/billing/README.md). Unset key: billing works, Stripe calls are off.
          BILLING_PUBLIC_SITE_URL: ${{ vars.BILLING_PUBLIC_SITE_URL }}
          PORTAL_HOST: ${{ vars.PORTAL_HOST }}
          PORTAL_ENABLED: ${{ vars.PORTAL_ENABLED }}
          PORTAL_FILES_BUCKET: ${{ vars.PORTAL_FILES_BUCKET }}
          BILLING_STRIPE_SECRET_KEY: ${{ secrets.BILLING_STRIPE_SECRET_KEY }}
          BILLING_STRIPE_WEBHOOK_SECRET: ${{ secrets.BILLING_STRIPE_WEBHOOK_SECRET }}
        run: |
          # Used only if Secret Manager has no such secret yet; existing values are always kept.
          NEW_DJANGO_SECRET_KEY="$(openssl rand -base64 64 | tr -d '\n')"
          NEW_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -base64 30 | tr -d '\n/+=')"
          # Shared with the Cloudflare edge Worker in front of Cloud Run (EdgeProxyMiddleware).
          NEW_EDGE_PROXY_SECRET="$(openssl rand -base64 48 | tr -d '\n/+=')"
          # Client portal push (ADR-056 Phase 2): a P-256 VAPID private key as its raw 32-byte scalar, base64url
          # (the SEC1 DER private key starts at byte 8). The public key is derived by the app.
          NEW_PORTAL_PUSH_VAPID_PRIVATE_KEY="$(openssl ecparam -name prime256v1 -genkey -noout | openssl ec -outform DER 2>/dev/null | tail -c +8 | head -c 32 | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          echo "::add-mask::$NEW_DJANGO_SECRET_KEY"
          echo "::add-mask::$NEW_BOOTSTRAP_ADMIN_PASSWORD"
          echo "::add-mask::$NEW_EDGE_PROXY_SECRET"
          echo "::add-mask::$NEW_PORTAL_PUSH_VAPID_PRIVATE_KEY"
          [ "${#NEW_PORTAL_PUSH_VAPID_PRIVATE_KEY}" -eq 43 ] || { echo "::error::could not generate the portal push key"; exit 1; }
          export NEW_DJANGO_SECRET_KEY NEW_BOOTSTRAP_ADMIN_PASSWORD NEW_EDGE_PROXY_SECRET NEW_PORTAL_PUSH_VAPID_PRIVATE_KEY
          superadmin/deploy/gcp/deploy.sh
      - name: Post-deploy check (live health and served image)
        env:
          IMAGE: ${{ needs.build.outputs.mirror }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # The public address is whatever the edge serves (Azure until the Cloudflare cutover, Cloud Run after);
          # the Cloud Run address and image show this deploy itself is live.
          for target in "$URL/healthz/" https://admin.vitalos.co.uk/healthz/; do
            ok=0
            for attempt in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$target" || true)"
              if [ "$code" = 200 ]; then ok=1; break; fi
              echo "$target returned $code (attempt $attempt of 30)"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "::error::$target did not return 200 within 5 minutes"; exit 1; }
          done
          running="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --format='value(spec.template.spec.containers[0].image)')"
          [ "$running" = "$IMAGE" ] || { echo "::error::service runs $running, expected $IMAGE"; exit 1; }
          echo "Healthy and serving $IMAGE"
      - name: Rollback command (run it yourself; nothing is rolled back automatically)
        if: failure()
        env:
          PREVIOUS: ${{ steps.prev.outputs.revision }}
        run: |
          echo "::error::Deploy failed. If the service already took the new image, send traffic back to the previous revision with:"
          echo "::error::gcloud run services update-traffic $CLOUD_RUN_SERVICE --project $GCP_PROJECT --region $GCP_REGION --to-revisions ${PREVIOUS:-<previous revision>}=100"
          echo "::error::Migrations only move forward; restore the backup taken just before this deploy (DEPLOY.md section 6) only if the data is damaged."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.smoke_test
        with:
          python-version: "3.12"
      - name: Live smoke test
        if: inputs.smoke_test
        working-directory: superadmin
        env:
          SMOKE_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
        run: |
          password="$(gcloud secrets versions access latest --project "$GCP_PROJECT" \
            --secret "$CLOUD_RUN_SERVICE--bootstrap-admin-password")"
          echo "::add-mask::$password"
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          SMOKE_BASE_URL=https://admin.vitalos.co.uk SMOKE_EMAIL="$SMOKE_EMAIL" SMOKE_PASSWORD="$password" \
            python e2e/smoke.py --skip-if-enrolled
