{% extends "accounts/_shell.html" %}
{% block section_title %}Password{% endblock %}
{% block settings_panel %}
  <section class="card max-w-3xl p-6" aria-labelledby="account-password-title" data-testid="account-password">
    <h2 id="account-password-title" class="font-semibold">Change password</h2>
    <p class="muted mb-4 text-sm">Enter your current password, then the new one twice.</p>
    <form method="post" action="{% url 'accounts:account_password' %}" class="max-w-md" novalidate>
      {% csrf_token %}<input type="hidden" name="action" value="password">
      {% include "partials/form_fields.html" with form=password_form %}
      <button type="submit" class="btn btn-primary mt-4">Change password</button>
    </form>
  </section>
{% endblock %}
